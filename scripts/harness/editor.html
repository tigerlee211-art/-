<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>fake smart editor</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  .se-help-container { background: #fffbe6; padding: 10px; }
  .se-popup-container { position: fixed; inset: 0; z-index: 1000; }
  .se-popup-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
  .se-popup-dialog { position: relative; z-index: 1001; width: 300px; margin: 100px auto; background: #fff; padding: 16px; border-radius: 8px; }
  .se-toolbar { padding: 8px; border-bottom: 1px solid #ccc; position: relative; }
  .se-toolbar button { margin-right: 6px; }
  #formatDropdown, #bgDropdown { display: none; position: absolute; background: #fff; border: 1px solid #ccc; padding: 6px; z-index: 10; }
  .se-section-documentTitle .se-text-paragraph { font-size: 20px; padding: 10px; border-bottom: 1px solid #eee; min-height: 30px; }
  .se-content { min-height: 800px; padding: 10px; }
  .se-component { border: 1px dashed transparent; margin: 4px 0; padding: 2px; }
  .se-component.se-quote { border-left: 3px solid #888; padding-left: 10px; }
  .se-component.se-horizontalLine { border-top: 2px solid #333; height: 4px; }
  .se-component.se-image .se-caption { width: 0; height: 0; overflow: hidden; }
  .se-component.se-image .se-caption.se-is-on { width: auto; height: auto; overflow: visible; border: 1px dotted #999; padding: 4px; }
  .se-sidebar-container-library { position: fixed; top: 100px; right: 0; width: 260px; height: 400px; background: #eee; z-index: 500; }
  .se-flayer-unified-toolbar-wrapper { position: fixed; left: 0; right: 0; bottom: 0; height: 60px; background: #ddd; z-index: 300; }
  #publishLayer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 900; }
  #publishLayer .inner { width: 320px; margin: 120px auto; background: #fff; padding: 16px; border-radius: 8px; }
  input[type=radio] { opacity: 0; width: 13px; height: 13px; pointer-events: none; }
</style>
</head>
<body>

  <div class="se-help-container" id="helpPanel">
    도움말입니다. <button class="se-help-panel-close-button" id="helpClose">닫기</button>
  </div>

  <div class="se-toolbar">
    <button class="se-text-format-toolbar-button" id="formatOpen">문단서식</button>
    <div id="formatDropdown">
      <button class="se-toolbar-option-text-format-sectionTitle-button">소제목</button>
      <button class="se-toolbar-option-text-format-text-button">본문</button>
      <button class="se-toolbar-option-text-format-quotation-button">인용구</button>
    </div>
    <button class="se-insert-horizontal-line-default-toolbar-button" id="dividerBtn">구분선</button>
    <button class="se-bold-toolbar-button" id="boldBtn">굵게</button>
    <button class="se-background-color-toolbar-button" id="bgOpen">배경색</button>
    <div id="bgDropdown">
      <button title="#fff8b2">노랑</button>
      <button class="se-color-palette-no-color">없음</button>
    </div>
    <button class="se-image-toolbar-button" id="imageBtn">사진</button>
    <input type="file" id="fileInput" style="display:none" />
    <button class="se-strike-toolbar-button" id="strikeBtn">취소선</button>
    <button data-click-area="tpb.publish" id="publishOpenBtn">발행</button>
    <button class="reserve-btn">예약 발행 0건</button>
  </div>

  <div class="se-section-documentTitle">
    <div class="se-text-paragraph" contenteditable="true" id="titleP"></div>
  </div>

  <div class="se-content" id="content">
    <div class="se-component se-text">
      <div class="se-component-content">
        <div class="se-text-paragraph" contenteditable="true"></div>
      </div>
    </div>
  </div>

  <div class="se-sidebar-container-library" id="sidebarDock" style="display:none">
    라이브러리 도크
    <button class="se-sidebar-close-button" id="sidebarClose">팝업 닫기</button>
  </div>

  <div class="se-flayer-unified-toolbar-wrapper">
    <div class="se-flayer-unified-toolbar se-flayer-unified-toolbar--expanded">
      글감 검색: <input type="text" class="se-flayer-unified-search-input" id="bottomSearch" />
    </div>
  </div>

  <div id="publishLayer">
    <div class="inner">
      <div>
        <input type="radio" id="open_public" name="visibility" value="2" checked />
        <label for="open_public">전체공개</label>
      </div>
      <div>
        <input type="radio" id="open_neighbor" name="visibility" value="3" />
        <label for="open_neighbor">이웃공개</label>
      </div>
      <div>
        <input type="radio" id="open_both_neighbor" name="visibility" value="1" />
        <label for="open_both_neighbor">서로이웃공개</label>
      </div>
      <div>
        <input type="radio" id="open_private" name="visibility" value="0" />
        <label for="open_private">비공개</label>
      </div>
      <button data-click-area="tpb*i.publish" id="publishConfirmBtn">확인</button>
    </div>
  </div>

  <div class="se-popup-container" id="restorePopup" style="display:none">
    <div class="se-popup-dim"></div>
    <div class="se-popup-dialog">
      <p>작성 중인 글이 있습니다. 이어서 작성하시겠습니까?</p>
      <button class="se-popup-button-confirm">이어서 작성</button>
      <button class="se-popup-button-cancel" id="popupCancel">취소</button>
    </div>
  </div>

<script>
  window.__clicks = { cancel: 0, strike: 0, bold: 0, imageInsert: 0 };
  window.__uploadedFileName = null;

  const params = new URLSearchParams(location.search);
  if (params.get("restore") === "1") {
    document.getElementById("restorePopup").style.display = "block";
  }

  // 모든 툴바 버튼은 mousedown에서 preventDefault해 현재 포커스/선택을 유지한다
  // (실제 리치텍스트 에디터의 표준 관행 — 안 하면 클릭할 때마다 포커스가 버튼으로 넘어가
  // 타이핑이 엉뚱한 곳으로 샌다).
  document.querySelectorAll(".se-toolbar button, #formatDropdown button, #bgDropdown button").forEach((el) => {
    el.addEventListener("mousedown", (e) => e.preventDefault());
  });

  function closestComponent(el) {
    return el ? el.closest(".se-component") : null;
  }

  function appendComponent(html) {
    const wrap = document.createElement("div");
    wrap.innerHTML = html;
    const el = wrap.firstElementChild;
    document.getElementById("content").appendChild(el);
    return el;
  }

  // 일반 문단(잠기지 않은)에서 Enter → 새 컴포넌트 생성 + 포커스 이동 (정상 동작)
  // 인용구(잠긴) 컴포넌트는 별도로 keydown을 막아 이 핸들러가 실행되지 않는다.
  document.getElementById("content").addEventListener(
    "keydown",
    (e) => {
      if (e.key !== "Enter") return;
      const target = e.target;
      if (!target.classList || !target.classList.contains("se-text-paragraph")) return;
      const comp = closestComponent(target);
      if (comp && comp.classList.contains("se-locked")) return; // 잠긴 컴포넌트는 이 핸들러가 안 걸리게 별도 처리됨
      e.preventDefault();
      const next = appendComponent(
        '<div class="se-component se-text"><div class="se-component-content"><div class="se-text-paragraph" contenteditable="true"></div></div></div>'
      );
      next.querySelector(".se-text-paragraph").focus();
    },
    true
  );

  // 배경 클릭(= .se-content 자기 자신을 직접 클릭) → 새 문단 생성 (7-5의 유일한 탈출구)
  document.getElementById("content").addEventListener("click", (e) => {
    if (e.target.id !== "content") return;
    const next = appendComponent(
      '<div class="se-component se-text"><div class="se-component-content"><div class="se-text-paragraph" contenteditable="true"></div></div></div>'
    );
    next.querySelector(".se-text-paragraph").focus();
  });

  // 복원 팝업
  document.getElementById("popupCancel").addEventListener("click", () => {
    window.__clicks.cancel++;
    document.getElementById("restorePopup").remove();
  });

  // 취소선 (미끼 버튼 — 눌리면 안 됨)
  document.getElementById("strikeBtn").addEventListener("click", () => {
    window.__clicks.strike++;
  });

  // 도움말 닫기
  document.getElementById("helpClose").addEventListener("click", () => {
    document.getElementById("helpPanel").style.display = "none";
  });

  // 사이드바(우측 도크) 닫기
  document.getElementById("sidebarClose").addEventListener("click", () => {
    document.getElementById("sidebarDock").style.display = "none";
  });

  // 문단서식 드롭다운
  document.getElementById("formatOpen").addEventListener("click", () => {
    const d = document.getElementById("formatDropdown");
    d.style.display = d.style.display === "block" ? "none" : "block";
  });

  document.querySelector(".se-toolbar-option-text-format-sectionTitle-button").addEventListener("click", () => {
    const comp = closestComponent(document.activeElement);
    if (comp) comp.classList.add("se-heading");
    document.getElementById("formatDropdown").style.display = "none";
  });
  document.querySelector(".se-toolbar-option-text-format-text-button").addEventListener("click", () => {
    const comp = closestComponent(document.activeElement);
    if (comp) comp.classList.remove("se-heading", "se-quote", "se-locked");
    document.getElementById("formatDropdown").style.display = "none";
  });
  document.querySelector(".se-toolbar-option-text-format-quotation-button").addEventListener("click", () => {
    const active = document.activeElement;
    const comp = closestComponent(active);
    if (comp) {
      comp.classList.add("se-quote", "se-locked");
      // ⚠️ 7-5 재현: 인용구 컴포넌트 안에서는 어떤 키로도 탈출되지 않는다.
      active.addEventListener("keydown", (e) => {
        if (["Enter", "ArrowDown", "Escape"].includes(e.key)) e.preventDefault();
      });
    }
    document.getElementById("formatDropdown").style.display = "none";
  });

  // 구분선 삽입 — 새 컴포넌트를 직접 append (현재 포커스와 무관)
  document.getElementById("dividerBtn").addEventListener("click", () => {
    appendComponent('<div class="se-component se-horizontalLine" contenteditable="false">―――――</div>');
  });

  document.getElementById("boldBtn").addEventListener("click", () => {
    window.__clicks.bold++;
  });
  document.getElementById("bgOpen").addEventListener("click", () => {
    const d = document.getElementById("bgDropdown");
    d.style.display = d.style.display === "block" ? "none" : "block";
  });
  document.querySelectorAll("#bgDropdown button").forEach((b) => {
    b.addEventListener("click", () => {
      document.getElementById("bgDropdown").style.display = "none";
    });
  });

  // 이미지 버튼 → 숨은 file input 클릭 → Playwright의 filechooser 이벤트가 여기서 발생한다
  document.getElementById("imageBtn").addEventListener("click", () => {
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    window.__uploadedFileName = file ? file.name : null;
    window.__clicks.imageInsert++;

    const comp = appendComponent(
      '<div class="se-component se-image"><div class="se-component-content">' +
        '<div class="se-fake-img" style="width:120px;height:80px;background:#ccc;">이미지</div>' +
        '<div class="se-caption se-is-empty" contenteditable="false"></div>' +
        "</div></div>"
    );
    // ⚠️ 7-21: 사진을 넣으면 우측 도크가 열려 본문을 덮는다
    document.getElementById("sidebarDock").style.display = "block";

    // ⚠️ 7-18: 캡션 칸은 업로드 직후 0×0이다. 이미지 컴포넌트 자체를 클릭해야 펼쳐진다(se-is-on).
    comp.addEventListener("click", () => {
      const caption = comp.querySelector(".se-caption");
      if (!caption.classList.contains("se-is-on")) {
        caption.classList.remove("se-is-empty");
        caption.classList.add("se-is-on");
        caption.setAttribute("contenteditable", "true");
      }
    });
  });

  // 발행 레이어
  document.getElementById("publishOpenBtn").addEventListener("click", () => {
    document.getElementById("publishLayer").style.display = "block";
  });
  document.getElementById("publishConfirmBtn").addEventListener("click", () => {
    const checked = document.querySelector("input[name=visibility]:checked");
    const vis = checked ? checked.id : "none";
    reportNow();
    // 실제 네이버는 발행 성공 시 탭 전체가 게시글 주소로 이동한다.
    window.top.location.href = location.origin + "/blog.naver.com/testuser/223456789?vis=" + vis;
  });

  // ===== 테스트 하네스 전용 계측: 현재 DOM 상태를 Node 테스트 서버로 보고한다 =====
  // (스크린샷 방식이 아니라, 어떤 버튼이 몇 번 눌렸는지 / 각 컴포넌트에 어떤 텍스트가 들어갔는지를
  //  코드로 직접 확인하기 위함. 실제 발행 코드에는 없는, 이 하네스만의 검증 장치다.)
  function reportNow() {
    const comps = [...document.querySelectorAll("#content .se-component")].map((c) => ({
      cls: c.className,
      text: c.textContent.trim(),
    }));
    const data = {
      clicks: window.__clicks,
      uploadedFileName: window.__uploadedFileName,
      bottomSearchValue: document.getElementById("bottomSearch").value,
      titleText: document.getElementById("titleP").textContent,
      components: comps,
    };
    fetch("/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
      keepalive: true,
    }).catch(() => {});
  }
  document.addEventListener("input", reportNow);
  document.addEventListener("click", reportNow);
</script>
</body>
</html>
