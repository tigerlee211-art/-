<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>outer</title></head>
  <body style="margin:0">
    <iframe id="mainFrame" src="editor.html" style="width:100%;height:900px;border:0;display:block;"></iframe>
    <script>
      // outer.html에 붙은 쿼리스트링(예: ?restore=1)을 그대로 iframe에도 전달한다.
      document.getElementById("mainFrame").src = "editor.html" + location.search;
    </script>
  </body>
</html>
